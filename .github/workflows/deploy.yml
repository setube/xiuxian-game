name: 部署 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 构建
        # 资源前缀由 vite.config.ts 的 base: './' 解决，这里不必再传
        run: pnpm run build
      - name: 404 兜底
        # history 模式的单页应用，直接访问子路径时 Pages 会返回它自己的 404 页，
        # 前端路由根本没机会接管。把 index.html 抄一份当 404 用是通行做法
        run: cp dist/index.html dist/404.html
      - name: 配置 Pages
        uses: actions/configure-pages@v5
      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 Pages
        id: deployment
        uses: actions/deploy-pages@v4
